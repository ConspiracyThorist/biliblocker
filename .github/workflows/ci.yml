name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --ignore-scripts

      - name: 类型检查
        run: npm run typecheck

      - name: 构建两端产物
        run: npm run build

      - name: 产物自检
        run: |
          # 版本号必须与 manifest 一致，否则装了扩展的用户收不到更新
          mkdir -p dist
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            const mf = require('./manifest.json');
            const us = fs.readFileSync('dist/BiliBlocker.user.js', 'utf8');
            const ver = (us.match(/@version\s+(\S+)/) || [])[1];
            const ok = pkg.version === mf.version && mf.version === ver;
            console.log('package', pkg.version, '| manifest', mf.version, '| userscript', ver);
            if (!ok) { console.error('版本号不一致'); process.exit(1); }
          "

      - name: 校验包内容（不许带本地文件与凭据）
        run: |
          if grep -rlE 'github-token|cloudflare-token|aliyun-ak' dist/ ; then
            echo "::error::产物里疑似包含凭据"
            exit 1
          fi
